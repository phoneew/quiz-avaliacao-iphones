<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avaliação de iPhone | Phonew</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
<style>
:root{--bg:#F6F4FC;--card:#FFFFFF;--ink:#15121C;--mute:#5E5A70;--line:#E1DDF0;--acc:#5B22FF;--acc-ink:#FFFFFF;--ok:#3F8600;--mid:#B7791F;--bad:#D12D3B;--sel:#EFE9FF;--mc:#3F8600;--mcbg:#EEFBD8;--cta:#15121C;--cta-ink:#FFFFFF;--lime:#A5F03A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0B1A;--card:#181328;--ink:#F1EEFB;--mute:#A9A3C2;--line:#2D2650;--acc:#8E6BFF;--acc-ink:#0E0B1A;--ok:#A5F03A;--mid:#E5B454;--bad:#FF7A86;--sel:#251C47;--mc:#A5F03A;--mcbg:#243014;--cta:#A5F03A;--cta-ink:#15121C;--lime:#A5F03A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0B1A;--card:#181328;--ink:#F1EEFB;--mute:#A9A3C2;--line:#2D2650;--acc:#8E6BFF;--acc-ink:#0E0B1A;--ok:#A5F03A;--mid:#E5B454;--bad:#FF7A86;--sel:#251C47;--mc:#A5F03A;--mcbg:#243014;--cta:#A5F03A;--cta-ink:#15121C;--lime:#A5F03A;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(60% 38% at 100% 0%,rgba(91,34,255,.14),transparent 70%),radial-gradient(50% 30% at 0% 100%,rgba(165,240,58,.16),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:400 16px/1.5 Outfit,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:"Plus Jakarta Sans",Outfit,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.1}
h2{font-size:22px;font-weight:600;margin-bottom:4px}
p{margin:0}.mute{color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:14px}
.q{margin-top:22px}.q:first-of-type{margin-top:14px}
.q>b{display:block;font-weight:600;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer;background:var(--card)}
.opt:has(input:checked){border-color:var(--acc);background:var(--sel)}
.opt:focus-within{outline:2px solid var(--acc);outline-offset:1px}
.opt input{margin-top:4px;accent-color:var(--acc)}
.multi .opt{border-left:4px solid var(--mc)}.multi .opt:has(input:checked){border-color:var(--mc);background:var(--mcbg)}.multi .opt input{accent-color:var(--mc)}.multi .opt:focus-within{outline-color:var(--mc)}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--mc);background:var(--mcbg);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.note{font-size:14px;color:var(--mute);background:var(--sel);border-radius:10px;padding:10px 12px;margin-top:12px}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--acc)}.key i.m{border-radius:2px;background:var(--mc)}
select{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px}
.nav{display:flex;gap:10px;margin-top:18px}
button{font:600 16px Outfit,system-ui,sans-serif;padding:13px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);flex:1}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hint{font-size:14px;color:var(--mute);margin-top:10px}
a.btn{display:block;text-align:center;text-decoration:none;font:600 16px Outfit,system-ui,sans-serif;padding:14px 18px;border-radius:12px;background:#0F7A3F;color:#fff;margin-top:18px}
a.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gauge{display:flex;gap:18px;align-items:center}
.gauge svg{flex:none;width:130px;height:130px}
.gauge .n{font:800 34px "Plus Jakarta Sans",sans-serif;fill:var(--ink)}
.v{font:800 24px "Plus Jakarta Sans",sans-serif;line-height:1.15}
.alert{border-left:4px solid var(--bad);background:var(--card);padding:12px 14px;border-radius:8px;margin-top:8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0}.row b{white-space:nowrap;color:var(--bad)}
.sec{margin-top:10px;font-size:14px}.sec div{display:flex;justify-content:space-between}
.sec .bar{margin:4px 0 8px;height:8px}.sec .bar i{background:var(--mid)}
textarea{width:100%;height:150px;margin-top:10px;font:14px/1.4 ui-monospace,monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
h2{font-weight:700}
button,a.btn{border-radius:999px}
button.p{background:var(--cta);color:var(--cta-ink);border-color:var(--cta)}
a.btn{background:#15121C;color:#fff;border:2px solid var(--lime);box-shadow:0 0 18px rgba(165,240,58,.35)}
.bar i{background:linear-gradient(90deg,var(--acc),var(--lime))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:inline-flex}.brand img{height:30px;width:auto;display:block}.l-dark{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .l-light{display:none}:root:not([data-theme="light"]) .l-dark{display:block!important}}
:root[data-theme="dark"] .l-light{display:none}:root[data-theme="dark"] .l-dark{display:block!important}
.loc{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:10px}.loc:after{content:"";width:36px;height:1px;background:var(--acc)}
.top+.bar{margin-top:36px}
.hero{margin:52px 0 20px}.hero h1{font-size:40px;line-height:1.03;letter-spacing:-.035em}.hero p{margin-top:14px;font-size:18px;max-width:34ch}
.grad{background:linear-gradient(90deg,var(--acc),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.rule{height:5px;width:90px;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--lime));margin-top:18px}
.trust{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.trust span{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px}.trust b{font-weight:600}
.foot{margin-top:28px;font-size:13px;color:var(--mute);text-align:center}
</style>
</head>

function calc(){const L=[],C=[],T=SEC.map(()=>0);
SEC.forEach((s,si)=>s.q.forEach(q=>{const v=A[q.k];
if(q.t==="s"){const o=q.o[v];if(o[1]>0){L.push([si,q.l+": "+o[0],o[1]]);T[si]+=o[1]}if(o[2])C.push(q.l+": "+o[0])}
else if(q.t==="m")(v||[]).forEach(i=>{const o=q.o[i];if(o[1]>0){L.push([si,o[0],o[1]]);T[si]+=o[1]}if(o[2])C.push(o[0])});
else if(q.t==="inc")q.o.forEach((o,i)=>{if(!(v||[]).includes(i)){L.push([si,"Sem "+o[0].toLowerCase(),o[1]]);T[si]+=o[1]}})}));
const tot=T.reduce((a,b)=>a+b,0),cons=Math.max(0,100-T[1]),oth=Math.max(0,100-(tot-T[1]));return{L:L.sort((a,b)=>b[2]-a[2]),C,T,cons,score:Math.min(Math.round(.65*cons+.35*oth),cons+8)}}
function grade(sc,crit){if(crit)return["Atenção crítica","var(--bad)","Não anunciar nem comprar antes de resolver os alertas."];
if(sc>=90)return["Impecável · Classe A+","var(--ok)","Seminovo premium. Pode anunciar com destaque e preço cheio."];
if(sc>=80)return["Muito bom · Classe A","var(--ok)","Seminovo em ótimo estado, com detalhes mínimos."];
if(sc>=65)return["Bom · Classe B","var(--mid)","Funcional, com desgaste ou ressalvas a informar no anúncio."];
if(sc>=45)return["Regular · Classe C","var(--mid)","Usado com detalhes relevantes. Precifique com desconto e seja transparente."];
return["Revisão necessária · Classe D","var(--bad)","Recomendado reparo antes da venda ou negociação como peças."]}
function result(){const r=calc(),g=grade(r.score,r.C.length),C=2*Math.PI*52;
const mod=A.mod+" · "+A.arm;
REPORT=`LAUDO DE AVALIAÇÃO PHONEW\n${mod}\nNota: ${r.score}/100 — ${g[0]}\nConservação: ${r.cons}/100\n`+(r.C.length?`\nALERTAS CRÍTICOS:\n${r.C.map(c=>"- "+c).join("\n")}\n`:"")+`\nPONTOS DE ATENÇÃO:\n`+(r.L.length?r.L.map(x=>`- ${x[1]} (-${x[2]})`).join("\n"):"- Nenhum")+`\n\nGarantia Apple: ${SEC[3].q[0].o[A.gar][0]}`+(A.icl===0?"\nLembrete: remover o iCloud e desativar o Buscar iPhone com o cliente na entrega.":"");
app.innerHTML=`${brand()}<h1 style="margin-top:40px">Laudo do aparelho</h1><p class="mute">${esc(mod)}</p>
<section class="card"><div class="gauge"><svg viewBox="0 0 130 130" role="img" aria-label="Nota ${r.score} de 100"><circle cx="65" cy="65" r="52" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="65" cy="65" r="52" fill="none" stroke="${g[1]}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-r.score/100)}" transform="rotate(-90 65 65)"/><text class="n" x="65" y="75" text-anchor="middle">${r.score}</text></svg>
<div><div class="v" style="color:${g[1]}">${g[0]}</div><p class="mute" style="margin-top:6px">${g[2]}</p></div></div></section>
<section class="card"><h2>Estado de conservação</h2><div class="sec"><div><span>Nota de conservação (peso de 65% na nota geral)</span><span>${r.cons}/100</span></div><div class="bar"><i style="width:${r.cons}%;background:${r.cons>=80?"var(--ok)":r.cons>=55?"var(--mid)":"var(--bad)"}"></i></div></div></section>
${r.C.length?`<section class="card"><h2>Alertas críticos</h2>${r.C.map(c=>`<div class="alert">${esc(c)}</div>`).join("")}</section>`:""}
<section class="card"><h2>Pontos perdidos por etapa</h2><div class="sec">${SEC.map((s,i)=>`<div><span>${s.n}</span><span>-${r.T[i]}</span></div><div class="bar"><i style="width:${Math.min(100,r.T[i])}%"></i></div>`).join("")}</div></section>
${A.icl===0?`<div class="note">Lembrete: na entrega, remover o iCloud do cliente e desativar o Buscar iPhone antes de concluir a troca.</div>`:""}<section class="card"><h2>Pontos de atenção</h2>${r.L.length?r.L.map(x=>`<div class="row"><span>${esc(x[1])}</span><b>-${x[2]}</b></div>`).join(""):`<p class="mute">Nenhum ponto de atenção. Aparelho sem desconto.</p>`}</section>
<a class="btn" id="wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent("Olá! Fiz a avaliação do meu iPhone:\n\n"+REPORT)}">Enviar avaliação para a equipe Phonew</a>
<div class="nav"><button id="redo">Nova avaliação</button><button class="p" id="copy">Copiar laudo</button></div><div id="out"></div>${foot}`;
window.scrollTo(0,0)}
function copy(){const b=document.getElementById("copy"),o=document.getElementById("out");
const show=()=>{o.innerHTML=`<textarea readonly>${esc(REPORT)}</textarea>`;o.querySelector("textarea").select()};
try{navigator.clipboard.writeText(REPORT).then(()=>{b.textContent="Laudo copiado"},show)}catch(e){show()}}
render();
</script>
</body>
</html>
